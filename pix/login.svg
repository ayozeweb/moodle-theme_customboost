<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" preserveAspectRatio="xMidYMid slice">
  <!-- Default login illustration for theme_customboost. Original artwork, GPL v3 like the rest of the theme. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset=".55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f97316" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1240" cy="220" r="520" fill="url(#glowA)"/>
  <circle cx="300" cy="980" r="480" fill="url(#glowB)"/>
  <circle cx="900" cy="620" r="360" fill="url(#glowC)"/>
  <rect width="1600" height="1100" fill="url(#dots)"/>

  <!-- Rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".12">
    <circle cx="1240" cy="220" r="160" stroke-width="2"/>
    <circle cx="1240" cy="220" r="250" stroke-width="2"/>
    <circle cx="1240" cy="220" r="350" stroke-width="1.5"/>
  </g>

  <!-- Learning path -->
  <path d="M120 820 C 380 640, 520 900, 780 700 S 1180 420, 1480 520" fill="none" stroke="url(#path)" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18" opacity=".9"/>
  <g>
    <circle cx="120" cy="820" r="16" fill="#a5b4fc"/>
    <circle cx="780" cy="700" r="20" fill="#ffffff"/>
    <circle cx="780" cy="700" r="34" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <circle cx="1480" cy="520" r="16" fill="#fdba74"/>
  </g>

  <!-- Floating course cards -->
  <g transform="translate(860 230) rotate(-6)">
    <rect width="360" height="240" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <rect x="28" y="28" width="304" height="96" rx="16" fill="#818cf8" fill-opacity=".55"/>
    <rect x="28" y="148" width="200" height="16" rx="8" fill="#ffffff" fill-opacity=".75"/>
    <rect x="28" y="180" width="140" height="12" rx="6" fill="#ffffff" fill-opacity=".4"/>
    <rect x="28" y="208" width="304" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>
    <rect x="28" y="208" width="210" height="8" rx="4" fill="#fdba74"/>
  </g>
  <g transform="translate(1080 560) rotate(5)">
    <rect width="300" height="200" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>
    <rect x="24" y="24" width="252" height="76" rx="14" fill="#22d3ee" fill-opacity=".4"/>
    <rect x="24" y="120" width="170" height="14" rx="7" fill="#ffffff" fill-opacity=".7"/>
    <rect x="24" y="148" width="110" height="10" rx="5" fill="#ffffff" fill-opacity=".38"/>
    <rect x="24" y="172" width="252" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>
    <rect x="24" y="172" width="90" height="8" rx="4" fill="#a5b4fc"/>
  </g>
  <g transform="translate(330 250) rotate(-3)">
    <rect width="260" height="180" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="62" cy="62" r="30" fill="#fdba74" fill-opacity=".8"/>
    <path d="M48 62 l10 10 l20 -22" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="46" width="120" height="12" rx="6" fill="#ffffff" fill-opacity=".7"/>
    <rect x="110" y="68" width="80" height="10" rx="5" fill="#ffffff" fill-opacity=".38"/>
    <rect x="32" y="122" width="196" height="10" rx="5" fill="#ffffff" fill-opacity=".25"/>
    <rect x="32" y="142" width="150" height="10" rx="5" fill="#ffffff" fill-opacity=".18"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M640 170 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6z" fill-opacity=".8"/>
    <path d="M1420 860 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5z" fill-opacity=".6"/>
    <path d="M220 560 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4z" fill-opacity=".55"/>
  </g>
</svg>
